<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile README preview</title>
  <style>
    :root { --page: #ffffff; --text: #1C1B19; --muted: #6E6A63; --rule: #DCD8D0; --accent: #D9531E; }
    body.dark { --page: #0d1117; --text: #ECE9E3; --muted: #9C978E; --rule: #383530; --accent: #E8663A; }
    body { margin: 0; background: var(--page); color: var(--text); font: 16px/1.6 -apple-system, "Segoe UI", sans-serif; }
    .bar { display: flex; justify-content: center; gap: 16px; padding: 12px; font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
    .bar button { background: none; border: 0; border-bottom: 1px solid var(--rule); color: var(--text); cursor: pointer; font: inherit; padding: 2px 0; }
    .bar button[aria-pressed="true"] { border-color: var(--accent); }
    main { width: min(830px, calc(100% - 32px)); margin: 24px auto 80px; }
    h2 { font-weight: 600; font-size: 1.5em; border-bottom: 1px solid var(--rule); padding-bottom: .3em; margin-top: 2em; }
    a { color: var(--accent); text-decoration: none; }
    img { max-width: 100%; }
    sub { color: var(--muted); }
  </style>
</head>
<body>
  <div class="bar">
    <button data-mode="light" aria-pressed="true">light</button>
    <button data-mode="dark" aria-pressed="false">dark</button>
  </div>
  <main id="readme">Loading README.md…</main>
  <script>
    // Minimal renderer for this README's subset of markdown; serve the repo root (python -m http.server) and open /preview/.
    const inline = s => s
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    function render(md) {
      const out = []; let list = false;
      for (const line of md.split("\n")) {
        if (line.startsWith("- ")) { if (!list) { out.push("<ul>"); list = true; } out.push("<li>" + inline(line.slice(2)) + "</li>"); continue; }
        if (list) { out.push("</ul>"); list = false; }
        if (line.startsWith("## ")) out.push("<h2>" + inline(line.slice(3)) + "</h2>");
        else if (line.trim() === "") out.push("");
        else out.push(line.startsWith("<") ? line : "<p>" + inline(line) + "</p>");
      }
      return out.join("\n").replaceAll('src="./', 'src="../').replaceAll('srcset="./', 'srcset="../');
    }
    function setMode(mode) {
      document.body.classList.toggle("dark", mode === "dark");
      document.querySelectorAll(".bar button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
      document.querySelectorAll("picture").forEach(p => {
        const img = p.querySelector("img"), src = p.querySelector("source");
        img.dataset.light ??= img.getAttribute("src");
        img.src = mode === "dark" ? src.getAttribute("srcset") : img.dataset.light;
        src.media = "not all";
      });
    }
    document.querySelectorAll(".bar button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
    fetch("../README.md").then(r => r.text()).then(md => { document.getElementById("readme").innerHTML = render(md); setMode("light"); });
  </script>
</body>
</html>
