<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Engineering capabilities</title><desc id="desc">Six modules covering frontend, backend, data, real-time systems, AI and RAG, and deployment.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B16"/><stop offset="1" stop-color="#0B1225"/></linearGradient><linearGradient id="line"><stop stop-color="#247BFF"/><stop offset="1" stop-color="#FF354F"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7896D2" fill-opacity=".08"/></pattern></defs>
  <rect x="1" y="1" width="998" height="758" rx="28" fill="url(#bg)" stroke="#7896D2" stroke-opacity=".22"/><rect x="1" y="1" width="998" height="758" rx="28" fill="url(#dots)"/>
  <text x="48" y="58" fill="#3B8CFF" font-family="ui-monospace,Consolas,monospace" font-size="16" letter-spacing="3">02 / CAPABILITIES</text>
  <text x="48" y="110" fill="#EEF1FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800">WHAT I BUILD</text>
  <text x="48" y="144" fill="#A3B0D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">From interface to infrastructure — and intelligence on top.</text>
  <path d="M48 170H952" stroke="url(#line)" stroke-opacity=".65"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(48 200)"><rect width="438" height="158" rx="22" fill="#101A3D" fill-opacity=".66" stroke="#3B8CFF" stroke-opacity=".35"/><text x="24" y="34" fill="#3B8CFF" font-family="ui-monospace,Consolas,monospace" font-size="15">01 / CLIENT</text><text x="24" y="74" fill="#EEF1FA" font-size="27" font-weight="700">Frontend Systems</text><text x="24" y="104" fill="#A3B0D4" font-size="17">Responsive product interfaces with clear state.</text><text x="24" y="137" fill="#66718F" font-family="ui-monospace,Consolas,monospace" font-size="15">REACT · NEXT.JS · TYPESCRIPT</text></g>
    <g transform="translate(514 200)"><rect width="438" height="158" rx="22" fill="#101A3D" fill-opacity=".66" stroke="#3B8CFF" stroke-opacity=".35"/><text x="24" y="34" fill="#3B8CFF" font-family="ui-monospace,Consolas,monospace" font-size="15">02 / SERVER</text><text x="24" y="74" fill="#EEF1FA" font-size="27" font-weight="700">Backend &amp; APIs</text><text x="24" y="104" fill="#A3B0D4" font-size="17">Auth, business logic and reliable REST services.</text><text x="24" y="137" fill="#66718F" font-family="ui-monospace,Consolas,monospace" font-size="15">NODE.JS · EXPRESS · REST</text></g>
    <g transform="translate(48 382)"><rect width="438" height="158" rx="22" fill="#101A3D" fill-opacity=".66" stroke="#3B8CFF" stroke-opacity=".35"/><text x="24" y="34" fill="#3B8CFF" font-family="ui-monospace,Consolas,monospace" font-size="15">03 / DATA</text><text x="24" y="74" fill="#EEF1FA" font-size="27" font-weight="700">Data Layer</text><text x="24" y="104" fill="#A3B0D4" font-size="17">Schemas and storage shaped around the product.</text><text x="24" y="137" fill="#66718F" font-family="ui-monospace,Consolas,monospace" font-size="15">POSTGRESQL · MONGODB · PRISMA</text></g>
    <g transform="translate(514 382)"><rect width="438" height="158" rx="22" fill="#101A3D" fill-opacity=".66" stroke="#FF526A" stroke-opacity=".3"/><text x="24" y="34" fill="#FF526A" font-family="ui-monospace,Consolas,monospace" font-size="15">04 / LIVE</text><text x="24" y="74" fill="#EEF1FA" font-size="27" font-weight="700">Real-Time Systems</text><text x="24" y="104" fill="#A3B0D4" font-size="17">Live messaging, presence and event-driven UX.</text><text x="24" y="137" fill="#66718F" font-family="ui-monospace,Consolas,monospace" font-size="15">SOCKET.IO · WEBSOCKETS</text></g>
    <g transform="translate(48 564)"><rect width="438" height="158" rx="22" fill="#101A3D" fill-opacity=".66" stroke="#FF526A" stroke-opacity=".3"/><text x="24" y="34" fill="#FF526A" font-family="ui-monospace,Consolas,monospace" font-size="15">05 / INTELLIGENCE</text><text x="24" y="74" fill="#EEF1FA" font-size="27" font-weight="700">AI / RAG</text><text x="24" y="104" fill="#A3B0D4" font-size="17">Grounded retrieval and media intelligence flows.</text><text x="24" y="137" fill="#66718F" font-family="ui-monospace,Consolas,monospace" font-size="15">PYTHON · EMBEDDINGS · VECTOR SEARCH</text></g>
    <g transform="translate(514 564)"><rect width="438" height="158" rx="22" fill="#101A3D" fill-opacity=".66" stroke="#3B8CFF" stroke-opacity=".35"/><text x="24" y="34" fill="#3B8CFF" font-family="ui-monospace,Consolas,monospace" font-size="15">06 / SHIP</text><text x="24" y="74" fill="#EEF1FA" font-size="27" font-weight="700">Deployment</text><text x="24" y="104" fill="#A3B0D4" font-size="17">Repeatable builds and production delivery.</text><text x="24" y="137" fill="#66718F" font-family="ui-monospace,Consolas,monospace" font-size="15">DOCKER · VERCEL · RENDER</text></g>
  </g>
</svg>
