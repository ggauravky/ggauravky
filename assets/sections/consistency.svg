<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">300 plus days of consistent building</title>
  <desc id="desc">A personal consistency milestone spanning learning, projects, data structures and algorithms, artificial intelligence, machine learning and full-stack development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070B16"/>
      <stop offset=".58" stop-color="#0A1022"/>
      <stop offset="1" stop-color="#0B1225"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#247BFF"/>
      <stop offset=".54" stop-color="#755BFF"/>
      <stop offset="1" stop-color="#FF354F"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy=".5" r=".75">
      <stop stop-color="#247BFF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#247BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="1" cy=".5" r=".75">
      <stop stop-color="#FF354F" stop-opacity=".09"/>
      <stop offset="1" stop-color="#FF354F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7896D2" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="998" height="298" rx="28" fill="url(#bg)" stroke="#7896D2" stroke-opacity=".24"/>
  <rect x="1" y="1" width="998" height="298" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="500" height="298" rx="28" fill="url(#blueGlow)"/>
  <rect x="500" y="1" width="499" height="298" rx="28" fill="url(#redGlow)"/>
  <path d="M29 1H360M640 299H971" stroke="url(#accent)" stroke-width="3"/>

  <text x="48" y="50" fill="#3B8CFF" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="700" letter-spacing="3">CONSISTENCY</text>
  <text x="952" y="50" fill="#66718F" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="end" letter-spacing="1.2">CODE / PROJECTS / DSA / AI/ML / FULL STACK</text>

  <text x="48" y="174" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="108" font-weight="900" letter-spacing="-5">300+</text>
  <text x="52" y="211" fill="#A3B0D4" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="1.8">PERSONAL MILESTONE</text>

  <path d="M356 72V216" stroke="#7896D2" stroke-opacity=".22"/>

  <text x="404" y="103" fill="#EEF1FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing=".2">DAYS OF CONSISTENT</text>
  <text x="404" y="145" fill="#EEF1FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing=".2">BUILDING</text>
  <text x="404" y="181" fill="#A3B0D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Consistency behind the projects.</text>

  <g font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1.3">
    <text x="404" y="215" fill="#3B8CFF">LEARNING</text>
    <text x="503" y="215" fill="#7896D2">/</text>
    <text x="525" y="215" fill="#EEF1FA">BUILDING</text>
    <text x="624" y="215" fill="#7896D2">/</text>
    <text x="646" y="215" fill="#FF526A">SHIPPING</text>
  </g>

  <path d="M404 248H938" stroke="#7896D2" stroke-opacity=".32"/>
  <path d="M404 248H938" stroke="url(#accent)" stroke-opacity=".75"/>
  <circle cx="404" cy="248" r="4" fill="#247BFF"/>
  <circle cx="938" cy="248" r="8" fill="#070B16" stroke="#FF526A" stroke-width="3"/>
  <text x="404" y="274" fill="#66718F" font-family="ui-monospace,Consolas,monospace" font-size="12">START</text>
  <text x="938" y="274" fill="#A3B0D4" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="end">TODAY / DAY 300+</text>
</svg>
