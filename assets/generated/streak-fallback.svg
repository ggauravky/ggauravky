<svg xmlns="http://www.w3.org/2000/svg" width="620" height="195" viewBox="0 0 620 195" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity refresh in progress</title>
  <desc id="desc">A branded fallback shown while the live GitHub streak card refreshes. The contribution timeline remains available below.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B16"/><stop offset="1" stop-color="#101A3D"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#247BFF"/><stop offset=".75" stop-color="#7068FF"/><stop offset="1" stop-color="#FF354F"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7896D2" fill-opacity=".09"/></pattern>
  </defs>
  <rect x="1" y="1" width="618" height="193" rx="20" fill="url(#bg)" stroke="#7896D2" stroke-opacity=".25"/>
  <rect x="1" y="1" width="618" height="193" rx="20" fill="url(#dots)"/>
  <path d="M22 1H222M438 194H598" stroke="url(#line)" stroke-width="3"/>
  <g transform="translate(42 40)">
    <circle cx="28" cy="52" r="28" fill="#247BFF" fill-opacity=".12" stroke="#3B8CFF" stroke-opacity=".65"/>
    <path d="M28 37v15l10 7" fill="none" stroke="#3B8CFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="28" cy="52" r="4" fill="#FF526A"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="122" y="55" fill="#3B8CFF" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="2">GITHUB ACTIVITY / SYNCING</text>
    <text x="122" y="96" fill="#EEF1FA" font-size="27" font-weight="750">Activity data is refreshing.</text>
    <text x="122" y="127" fill="#A3B0D4" font-size="16">The contribution timeline below still reflects</text>
    <text x="122" y="150" fill="#A3B0D4" font-size="16">Gaurav's public GitHub activity.</text>
  </g>
  <text x="515" y="174" fill="#66718F" font-family="ui-monospace,Consolas,monospace" font-size="11">&lt;GKY /&gt;</text>
</svg>
