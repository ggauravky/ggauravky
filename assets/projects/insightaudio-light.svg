<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-labelledby="t d">
  <title id="t">Project 02 — InsightAudio</title>
  <desc id="d">InsightAudio: AI meeting intelligence. Turns YouTube or local media into transcripts, structured notes and grounded Q&amp;A. Dual speech-to-text routing plus citation-backed vector retrieval. Stack: Python, Whisper, LangChain, ChromaDB, Streamlit.</desc>
