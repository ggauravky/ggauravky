  <title id="t">Project 04 — TrueCert</title>
  <desc id="d">TrueCert: Certificate verification SaaS. Issues digital certificates with public verification, revocation and expiry handling. SHA-256 integrity checks, QR verification and scan analytics. Stack: React, Node.js, MongoDB, Cloudinary, SHA-256.</desc>
