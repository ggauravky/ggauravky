<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">InsightAudio project card</title><desc id="desc">A Python media intelligence pipeline using Whisper, LangChain, embeddings, ChromaDB and PDF export.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1225"/><stop offset="1" stop-color="#101A3D"/></linearGradient><linearGradient id="accent"><stop stop-color="#247BFF"/><stop offset="1" stop-color="#FF354F"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7896D2" stroke-opacity=".06"/></pattern></defs>
  <rect x="1" y="1" width="998" height="298" rx="26" fill="url(#bg)" stroke="#7896D2" stroke-opacity=".22"/><rect x="1" y="1" width="998" height="298" rx="26" fill="url(#grid)"/><rect x="1" y="1" width="8" height="298" rx="4" fill="url(#accent)"/>
  <text x="42" y="50" fill="#FF526A" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="2">PROJECT 02 / AI + RAG</text>
  <text x="42" y="112" fill="#EEF1FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800">InsightAudio</text>
  <text x="42" y="145" fill="#A3B0D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Turns YouTube or local media into transcripts,</text>
  <text x="42" y="169" fill="#A3B0D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">structured notes and grounded Q&amp;A.</text>
  <text x="42" y="199" fill="#EEF1FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650">ENGINEERING SIGNAL</text>
  <text x="42" y="229" fill="#A3B0D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Dual STT routing plus citation-backed vector retrieval.</text>
  <g font-family="ui-monospace,Consolas,monospace" font-size="14"><rect x="658" y="45" width="292" height="202" rx="20" fill="#070B16" fill-opacity=".72" stroke="#FF526A" stroke-opacity=".27"/><text x="686" y="80" fill="#66718F">PIPELINE</text><text x="686" y="117" fill="#EEF1FA">MEDIA → WHISPER</text><path d="M686 128h214" stroke="#3B8CFF" stroke-opacity=".38"/><text x="686" y="157" fill="#EEF1FA">CHUNKS → EMBEDDINGS</text><path d="M686 168h214" stroke="#3B8CFF" stroke-opacity=".38"/><text x="686" y="197" fill="#EEF1FA">CHROMA → GROUNDED ANSWER</text><text x="686" y="227" fill="#66718F">SOURCE VERIFIED</text></g>
  <text x="42" y="274" fill="#66718F" font-family="ui-monospace,Consolas,monospace" font-size="15">PYTHON  ·  LANGCHAIN  ·  CHROMADB  ·  STREAMLIT  ·  PDF</text>
</svg>
