<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">SmartMess project card</title><desc id="desc">A hostel dining operations platform for menus, meal tracking, ratings, complaints and role-based workflows.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1225"/><stop offset="1" stop-color="#101A3D"/></linearGradient><linearGradient id="accent"><stop stop-color="#247BFF"/><stop offset="1" stop-color="#44B7FF"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7896D2" stroke-opacity=".06"/></pattern></defs>
  <rect x="1" y="1" width="998" height="298" rx="26" fill="url(#bg)" stroke="#7896D2" stroke-opacity=".22"/><rect x="1" y="1" width="998" height="298" rx="26" fill="url(#grid)"/><rect x="1" y="1" width="8" height="298" rx="4" fill="url(#accent)"/>
  <text x="42" y="50" fill="#3B8CFF" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="2">PROJECT 03 / OPERATIONS PLATFORM</text>
  <text x="42" y="112" fill="#EEF1FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800">SmartMess</text>
  <text x="42" y="145" fill="#A3B0D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Digitizes hostel menus, attendance, meal feedback</text>
  <text x="42" y="169" fill="#A3B0D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">and complaint resolution.</text>
  <text x="42" y="199" fill="#EEF1FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650">ENGINEERING SIGNAL</text>
  <text x="42" y="229" fill="#A3B0D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Student/admin flows with JWT and relational data.</text>
  <g font-family="ui-monospace,Consolas,monospace" font-size="14"><rect x="658" y="45" width="292" height="202" rx="20" fill="#070B16" fill-opacity=".72" stroke="#3B8CFF" stroke-opacity=".28"/><text x="686" y="80" fill="#66718F">WORKFLOW SIGNALS</text><rect x="686" y="101" width="100" height="30" rx="15" fill="#101A3D" stroke="#3B8CFF" stroke-opacity=".32"/><text x="706" y="121" fill="#EEF1FA">ROLE AUTH</text><rect x="798" y="101" width="122" height="30" rx="15" fill="#101A3D" stroke="#3B8CFF" stroke-opacity=".32"/><text x="816" y="121" fill="#EEF1FA">MEAL DATA</text><rect x="686" y="143" width="116" height="30" rx="15" fill="#101A3D" stroke="#3B8CFF" stroke-opacity=".32"/><text x="706" y="163" fill="#EEF1FA">FEEDBACK</text><rect x="814" y="143" width="106" height="30" rx="15" fill="#101A3D" stroke="#FF526A" stroke-opacity=".28"/><text x="832" y="163" fill="#EEF1FA">ADMIN</text><text x="686" y="227" fill="#66718F">LIVE + SOURCE VERIFIED</text></g>
  <text x="42" y="274" fill="#66718F" font-family="ui-monospace,Consolas,monospace" font-size="15">REACT  ·  NODE.JS  ·  EXPRESS  ·  SUPABASE  ·  POSTGRESQL</text>
</svg>
