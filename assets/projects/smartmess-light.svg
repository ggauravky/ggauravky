<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-labelledby="t d">
  <title id="t">Project 03 — SmartMess</title>
  <desc id="d">SmartMess: Hostel operations platform. Digitizes hostel menus, attendance, meal feedback and complaint resolution. Student and admin flows with JWT auth and relational data. Stack: React, Node.js, Express, PostgreSQL, Supabase.</desc>
